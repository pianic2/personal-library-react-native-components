# Categories for the notes GitHub generates when a release is created ("Generate release notes").
# A pull request lands in the first category that has one of its labels; the last category catches the rest.
# Template for the hand-written part: docs/policies/release-notes-template.md.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels:
        - breaking
    - title: Migration
      labels:
        - migration
    - title: Deprecations
      labels:
        - deprecation
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
