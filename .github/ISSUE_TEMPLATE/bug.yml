name: Bug report
description: Something does not work as documented.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first. Do not include passwords, tokens, or other secrets. For security problems do not use this form: see the security link on the issue chooser.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - iOS
        - Android
        - Web (react-native-web)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Expo SDK / React Native / Node versions
      placeholder: "Expo 57, React Native 0.86, Node 22.13"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Steps or a short snippet that shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
