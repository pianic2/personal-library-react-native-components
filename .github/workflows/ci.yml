name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Environment
        run: |
          node -v
          npm -v
          git rev-parse HEAD

      - name: Release check
        run: npm run release:check
