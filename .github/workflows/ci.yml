name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Environment
        run: |
          node -v
          npm -v
          git rev-parse HEAD

      - name: Release check
        run: npm run release:check

      # PLRNUI-191 asks for the gates as named steps. They are also part of release:check, and they need node_modules, which
      # release:check installs, so they run after it.
      - name: Maturity gate
        run: npm run maturity:check

      - name: Token usage gate
        run: npm run tokens:check

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Maturity page is current
        run: npm run maturity:docs:check
