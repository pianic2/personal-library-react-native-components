name: PLRNUI-63 final publication evidence

on:
  push:
    branches:
      - plrnui-63-publication-prep
    paths:
      - .github/workflows/plrnui-63-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: plrnui-63-publication-prep

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Close publication breaking-change dispositions
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          register = Path('audit/migration/breaking-change-register.md')
          text = register.read_text()
          targets = ['BC-002', 'BC-003', 'BC-004', 'BC-008', 'BC-011']
          for bc in targets:
              marker = f'### {bc} -'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'Missing breaking-change section: {bc}')
              end = text.find('\n### ', start + len(marker))
              if end < 0:
                  end = len(text)
              section = text[start:end]
              updated, count = re.subn(r'(?m)^- Status: .*$', '- Status: verified', section, count=1)
              if count != 1:
                  raise SystemExit(f'Missing Status line in {bc}')
              text = text[:start] + updated + text[end:]
          register.write_text(text)

          changelog = Path('audit/migration/migration-changelog.md')
          ctext = changelog.read_text()
          heading = '## PLRNUI-63 — First RC publication preparation (2026-09-09)'
          if heading not in ctext:
              ctext = ctext.rstrip() + f'''\n\n{heading}\n\n- Assigned the first RC candidate version `0.1.0-rc.1`; package and lockfile must remain coherent.\n- Added fail-closed publication metadata for npmjs, public access and the `rc` dist-tag; implicit `latest` publication is forbidden.\n- Moved canonical CI to Node 24 and expanded `release:check` to include tests, packed consumer smoke, Expo SDK 57 consumer smoke and production dependency audit.\n- Added an automatic `prepack` build plus release guard so an RC cannot pack as `0.0.0`, a non-RC version, or with drifted package metadata.\n- Corrected navigation stability wording: `NavProvider` and `useNav` are beta; `useNavigate` is experimental; `stable` remains zero.\n- Closed BC-002, BC-003, BC-004, BC-008 and BC-011 as `verified` for the first-RC publication boundary based on the completed naming, root-API, deep-import, register-freshness and stability-label evidence.\n- PLRNUI-62 native runtime disposition remains unchanged: Expo Go Android PASS; native Android/iOS residuals are owner-accepted but are not platform PASS claims.\n- Added first-RC release notes and an explicit npm authentication/provenance bootstrap disposition. No npm publish, Git tag or GitHub Release is performed by PLRNUI-63.\n'''
              changelog.write_text(ctext)
          PY
          git diff --check
          git diff -- audit/migration/breaking-change-register.md audit/migration/migration-changelog.md | sed -n '1,220p'

      - name: Commit publication governance dispositions
        run: |
          if ! git diff --quiet -- audit/migration/breaking-change-register.md audit/migration/migration-changelog.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add audit/migration/breaking-change-register.md audit/migration/migration-changelog.md
            git commit -m "PLRNUI-63 verify publication breaking-change dispositions"
            git push origin HEAD:plrnui-63-publication-prep
          fi

      - name: Align RC lockfile and remediate audit finding
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(l.version!==p.version || l.packages[''].version!==p.version) process.exit(1)"
          git diff --check
          git diff -- package-lock.json | sed -n '1,160p'

      - name: Commit aligned lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "PLRNUI-63 remediate dependency audit and align RC lockfile"
            git push origin HEAD:plrnui-63-publication-prep
          fi

      - name: Clean install with strict install-script policy
        run: npm ci

      - name: Registry and candidate-version check
        shell: bash
        run: |
          npm ping --registry=https://registry.npmjs.org/
          set +e
          npm view @personal-library/react-native-components@0.1.0-rc.1 version --registry=https://registry.npmjs.org/
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Candidate version already exists on npm; refusing immutable-version reuse."
            exit 1
          fi
          echo "Candidate version is not currently resolvable from the public registry (expected before first publication)."

      - name: Dependency security disposition
        shell: bash
        run: |
          npm audit --json > /tmp/plrnui63-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/plrnui63-audit.json','utf8'));
          console.log('AUDIT_METADATA=' + JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
            console.log(`AUDIT_ITEM name=${name} severity=${item.severity} direct=${item.isDirect} via=${JSON.stringify(item.via)}`);
          }
          NODE
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high

      - name: Install-script inventory
        run: npm install-scripts ls

      - name: Full release check
        run: npm run release:check

      - name: Final artifact identity and leakage check
        shell: bash
        run: |
          rm -rf /tmp/plrnui63-artifact
          mkdir -p /tmp/plrnui63-artifact
          npm pack --pack-destination /tmp/plrnui63-artifact
          TGZ=$(find /tmp/plrnui63-artifact -maxdepth 1 -name '*.tgz' -print -quit)
          echo "FINAL_TARBALL=$(basename "$TGZ")"
          sha256sum "$TGZ"
          echo "FINAL_SIZE_BYTES=$(stat -c %s "$TGZ")"
          count=$(tar -tzf "$TGZ" | wc -l)
          echo "FINAL_FILE_COUNT=$count"
          tar -tzf "$TGZ" > /tmp/plrnui63-files.txt
          if grep -E '^package/(src|audit|tests|scripts|examples|docs|\.github)(/|$)' /tmp/plrnui63-files.txt; then
            echo "Forbidden repository-only content leaked into tarball"
            exit 1
          fi
          tar -tzf "$TGZ" | grep -Fx 'package/dist/index.js'
          tar -tzf "$TGZ" | grep -Fx 'package/dist/index.d.ts'
          tar -tzf "$TGZ" | grep -Fx 'package/package.json'
          tar -tzf "$TGZ" | grep -Fx 'package/README.md'
          tar -tzf "$TGZ" | grep -Fx 'package/LICENSE'
          git diff --check
          git status --short
