name: PLRNUI-64 lock sync

on:
  push:
    branches:
      - plrnui-64-expo57-compatibility
    paths:
      - package.json
      - .github/workflows/plrnui-64-lock-sync.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: plrnui-64-expo57-compatibility

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify RN peer contract
        shell: bash
        run: |
          node <<'NODE'
          const p = require('./package.json');
          const l = require('./package-lock.json');
          const expected = '>=0.86.0 <0.87.0';
          if (p.peerDependencies['react-native'] !== expected) {
            throw new Error(`package.json RN peer mismatch: ${p.peerDependencies['react-native']}`);
          }
          if (l.packages[''].peerDependencies['react-native'] !== expected) {
            throw new Error(`package-lock root RN peer mismatch: ${l.packages[''].peerDependencies['react-native']}`);
          }
          NODE

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "PLRNUI-64 regenerate lockfile for RN 0.86"
          git push origin HEAD:plrnui-64-expo57-compatibility
